name: Update USDJPY daily reference

on:
  schedule:
    # 外為トゥデイは平日8:30〜9:00頃更新。JST 9:20と10:05に確認する。
    - cron: "20 0 * * 1-5"
    - cron: "5 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-usdjpy-content
  cancel-in-progress: false

jobs:
  update-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Refresh daily USDJPY reference
        run: python scripts/update_daily.py
      - name: Commit refreshed reference
        run: |
          if git diff --quiet -- daily.json; then
            echo "No daily report changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.json
          git commit -m "Update USDJPY daily reference"
          git push
