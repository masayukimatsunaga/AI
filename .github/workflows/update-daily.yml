name: Update USDJPY daily reference

on:
  schedule:
    # 配信時刻の前後を15分おきに確認する。ページ側も配信元RSSを直接確認する。
    # 月〜金 8:07〜8:52 JST（UTCでは前日23時）
    - cron: "7,22,37,52 23 * * 0-4"
    # 月〜金 9:07〜10:52 JST
    - cron: "7,22,37,52 0-1 * * 1-5"
    # 月〜金 17:07〜19:52 JST
    - cron: "7,22,37,52 8-10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-usdjpy-content
  cancel-in-progress: false

jobs:
  update-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Refresh daily USDJPY reference
        run: python scripts/update_daily.py
      - name: Commit refreshed reference
        run: |
          if git diff --quiet -- daily.json; then
            echo "No daily report changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.json
          git commit -m "Update USDJPY daily reference"
          git push
