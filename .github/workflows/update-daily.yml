name: Update USDJPY daily reference

on:
  schedule:
    # 配信遅延にも追随できるよう、平日7:07〜21:52 JSTを15分おきに確認する。
    # ページ側でも配信元RSSを5分おき・画面復帰時に直接確認する。
    - cron: "7,22,37,52 22-23 * * 0-4"
    - cron: "7,22,37,52 0-12 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-usdjpy-content
  cancel-in-progress: false

jobs:
  update-daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Refresh daily USDJPY reference
        run: python scripts/update_daily.py
      - name: Commit refreshed reference
        run: |
          if git diff --quiet -- daily.json; then
            echo "No daily report changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daily.json
          git commit -m "Update USDJPY daily reference"
          git push
