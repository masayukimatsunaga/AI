name: Update USDJPY news snapshot

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-usdjpy-content
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Refresh Japanese USDJPY news
        run: |
          python scripts/update_news.py
          python scripts/update_225225.py
      - name: Commit refreshed snapshot
        run: |
          if git diff --quiet -- news.json market_context.json; then
            echo "No market content changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json market_context.json
          git commit -m "Update USDJPY market context"
          git push
